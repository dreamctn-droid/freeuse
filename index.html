<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 轉 JPG 並上傳至 GitHub - 高品質圖檔轉換器</title>
  <meta name="description" content="輕鬆將 PDF 檔案轉換為高品質 JPG 圖片，並支援一鍵打包下載與直接上傳至 GitHub 儲存庫。">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- JSZip CDN for batch zip download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📄 PDF 轉 JPG 與 GitHub 上傳神器</h1>
      <p>極速在高解析度下將 PDF 頁面轉成 JPG 圖片，並快速同步備份上傳至 GitHub 儲存庫</p>
    </header>

    <main class="app-grid">
      <!-- Left Column: PDF Converter -->
      <section class="card" id="converterCard">
        <h2 class="card-title"><span class="icon">🖼️</span> 第一步：選擇與轉換 PDF</h2>
        
        <div class="dropzone" id="dropzone">
          <input type="file" id="pdfFileInput" accept=".pdf,application/pdf">
          <div class="dropzone-icon">📥</div>
          <div class="dropzone-text" id="dropzoneText">拖曳 PDF 檔案至此處，或點擊瀏覽選取</div>
          <div class="dropzone-sub">支援單頁與多頁 PDF 文件</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="qualitySelect">圖檔解析度 (DPI)</label>
            <select id="qualitySelect" class="form-control">
              <option value="1.5">標準 (150 DPI - 較小檔案)</option>
              <option value="2.0" selected>高清 (200 DPI - 推薦)</option>
              <option value="3.0">超高清 (300 DPI - 印刷級)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="pageRangeInput">轉換頁數 (選填)</label>
            <input type="text" id="pageRangeInput" class="form-control" placeholder="例如: 1-5, 8 (留空轉全部)">
          </div>
        </div>

        <div class="form-group">
          <button id="convertBtn" class="btn btn-primary" disabled>
            <span>⚡ 開始轉換為 JPG</span>
          </button>
        </div>
      </section>

      <!-- Right Column: GitHub Settings -->
      <section class="card" id="githubCard">
        <h2 class="card-title"><span class="icon">🐙</span> 第二步：GitHub 上傳設定</h2>
        
        <div class="form-group">
          <label class="form-label" for="ghRepoInput">GitHub 儲存庫 (Owner/Repo)</label>
          <input type="text" id="ghRepoInput" class="form-control" placeholder="例如: dreamctn-droid/freeuse" value="dreamctn-droid/freeuse">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="ghBranchInput">目標分支 (Branch)</label>
            <input type="text" id="ghBranchInput" class="form-control" value="main" placeholder="main">
          </div>
          <div class="form-group">
            <label class="form-label" for="ghFolderInput">儲存路徑 (Folder)</label>
            <input type="text" id="ghFolderInput" class="form-control" value="images" placeholder="images">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="ghTokenInput">Personal Access Token (PAT)</label>
          <input type="password" id="ghTokenInput" class="form-control" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        </div>

        <div class="form-group">
          <label class="form-label" for="ghCommitMsgInput">提交訊息 (Commit Message)</label>
          <input type="text" id="ghCommitMsgInput" class="form-control" placeholder="Upload converted JPG images from PDF">
        </div>

        <div class="form-group">
          <button id="uploadGithubBtn" class="btn btn-success" disabled>
            <span>🚀 一鍵上傳 JPG 到 GitHub</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Status & Logs Section -->
    <section class="card" style="margin-top: 2rem;">
      <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
        <span>📊</span> 執行進度與狀態日誌
      </h3>
      
      <div id="progressContainer" class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="logBox" class="log-box">
        <div class="log-entry info">[系統就緒] 請在上方選擇 PDF 檔案以開始轉換...</div>
      </div>
    </section>

    <!-- Preview & Action Section -->
    <section id="previewSection" style="display: none;">
      <div class="preview-header">
        <h2>🖼️ JPG 圖片預覽</h2>
        <div>
          <button id="downloadAllBtn" class="btn btn-primary btn-sm" disabled style="width: auto; padding: 0.6rem 1.2rem;">
            📦 下載全部 JPG (ZIP)
          </button>
        </div>
      </div>

      <div id="previewGrid" class="preview-grid">
        <!-- Rendered preview cards will appear here -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
